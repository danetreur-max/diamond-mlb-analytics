services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mlb
      POSTGRES_USER: mlb
      POSTGRES_PASSWORD: mlb_local_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - mlb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlb"]
      interval: 5s
      retries: 10
volumes:
  mlb_data:
